services:
  - type: web
    name: minecraft-afk-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MC_SERVER_HOST
        value: gemsmps.joinmc.world
      - key: MC_SERVER_PORT
        value: "27637"
      - key: MC_SERVER_VERSION
        value: ""
      - key: MC_BOT_USERNAME
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: DASHBOARD_USER
        value: admin
      - key: MC_BOT_AUTH
        value: offline
      - key: MC_ON_JOIN_COMMANDS
        value: '["/vanish","/gamemode spectator","/tp @s 0 -65 0"]'
      - key: DISCORD_WEBHOOK_URL
        sync: false
